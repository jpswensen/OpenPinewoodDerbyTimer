; PWDTimer firmware — minimal serial-only build
;
; Target: ESP32-DEVKITC-32D (WROOM-32D module)
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:esp32doit-devkit-v1]
;platform   = espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board      = esp32doit-devkit-v1
framework  = arduino

board_build.f_cpu    = 240000000L
board_build.f_flash  = 80000000L   ; 80 MHz flash (max for WROOM-32D, speeds instruction fetch)
board_build.flash_mode = qio        ; Quad I/O (4-bit) vs default DIO; faster cache-line fills

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, send_on_enter
monitor_eol     = LF

build_flags =
    -std=gnu++2c
    -O2                  ; speed over size — benefits the tight timing loop most
    -DCORE_DEBUG_LEVEL=0 ; compile out all ESP-IDF log_e/i/v calls
    -flto                  ; link-time optimization; further reduces code size and improves speed

build_src_flags =
    -fno-exceptions      ; not used; removes unwinding tables (C++ sources only)
    -fno-rtti            ; not used; saves code space (C++ sources only)

build_unflags =
    -std=gnu++11
    -Os                  ; remove Arduino's default size optimisation so -O2 takes effect
    -fno-lto                  ; disable Arduino's default LTO so -flto takes effect

; PWDTimer firmware — minimal serial-only build
;
; Target: ESP32-DEVKITC-32D (WROOM-32D module)
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:esp32doit-devkit-v1]
; Pin to the last official Espressif PlatformIO release that ships
; Arduino-ESP32 2.0.x.  Arduino-ESP32 3.x (pioarduino fork) changes the
; default Serial/UART init in ways that broke our boot output here.
; platform   = espressif32@6.10.0
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board      = esp32doit-devkit-v1
framework  = arduino

board_build.f_cpu    = 240000000L
board_build.f_flash  = 80000000L   ; 80 MHz flash (max for WROOM-32D, speeds instruction fetch)
board_build.flash_mode = qio        ; Quad I/O (4-bit) vs default DIO; faster cache-line fills

monitor_speed   = 115200
; NOTE: Do NOT add `esp32_exception_decoder` here when using pioarduino
; Arduino-ESP32 3.3.8 / IDF 5.5.4.  The filter has a regression that drops
; the first character of every line on the serial monitor (firmware output
; itself is fine — confirmed via raw `screen` / `picocom`).  Tracked at
; https://github.com/pioarduino/platform-espressif32/issues/480
; If you need crash decoding, install the standalone "ESP Crash Decoder"
; VS Code extension (Jason2866.esp-decoder) which fully replaces the
; PlatformIO monitor.
monitor_filters = send_on_enter
monitor_eol     = LF

build_flags =
    -std=gnu++17         ; C++17 features; not strictly needed but allows use of std::optional and other niceties
    -O2                  ; speed over size — benefits the tight timing loop most
    -DCORE_DEBUG_LEVEL=0 ; compile out all ESP-IDF log_e/i/v calls
    -DPWDTIMER_ENABLE_WIFI=1 ; enable SoftAP + UDP transport. Comment out for serial-only build.
    ; -flto                  ; link-time optimization; further reduces code size and improves speed

build_src_flags =
    -fno-exceptions      ; not used; removes unwinding tables (C++ sources only)
    -fno-rtti            ; not used; saves code space (C++ sources only)

build_unflags =
    -std=gnu++11
    -Os                  ; remove Arduino's default size optimisation so -O2 takes effect
    ; -fno-lto                  ; disable Arduino's default LTO so -flto takes effect

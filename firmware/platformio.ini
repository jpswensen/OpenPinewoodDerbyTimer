; PlatformIO Project Configuration File
; PWDTimer ESP32 Firmware
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize, esp32_exception_decoder
build_type = debug
board_build.partitions = min_spiffs.csv

build_flags =
    -DCORE_DEBUG_LEVEL=3

lib_deps =
    https://github.com/tzapu/WiFiManager.git

; Native environment for unit testing without hardware (mock HAL + mock comm)
; Only portable sources are compiled (mock_hal, mock_comm, message_protocol,
; app_controller, nvs_config); esp32_hal/serial_comm/tcp_comm are ARDUINO-only.
[env:native]
platform = native
build_flags =
    -DMOCK_HAL
    -std=c++17
    -Isrc
test_framework = unity

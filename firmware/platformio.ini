; PlatformIO Project Configuration File
; PWDTimer ESP32 Firmware
;
; Build: pio run
; Upload: pio run --target upload
; Monitor: pio device monitor

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1

board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.flash_mode = qio

framework = arduino

; monitor_speed = 115200
monitor_filters = esp32_exception_decoder, send_on_enter
monitor_echo = yes
monitor_eol = LF

; Native environment for unit testing without hardware (mock HAL + mock comm)
; Only portable sources are compiled (mock_hal, mock_comm, message_protocol,
; app_controller, nvs_config); esp32_hal/serial_comm/tcp_comm are ARDUINO-only.
[env:native]
platform = native
build_flags =
    -DMOCK_HAL
    -std=c++17
    -Isrc
test_framework = unity
